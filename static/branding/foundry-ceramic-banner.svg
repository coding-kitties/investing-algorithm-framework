<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title description"><title id="title">QuantOS - Ceramic Layers README banner</title><desc id="description">Quant Foundry variant. Five stacked planes represent charts, metrics, live monitoring, backtesting, and results &amp; storage. Each plane repeats the same gradient. Pale ceramic faces and violet edges give the stack a quieter, more contemporary open-source identity. Visual architecture concept, not a verified feature specification.</desc><style>text{white-space:pre;font-kerning:none}</style><defs><linearGradient id="module-gradient" gradientUnits="userSpaceOnUse" x1="-116" y1="-48" x2="116" y2="48"><stop offset="0%" stop-color="#634dcc"/><stop offset="25%" stop-color="#7563cc"/><stop offset="50%" stop-color="#8b7ccf"/><stop offset="75%" stop-color="#9e93cf"/><stop offset="100%" stop-color="#b1a8d7"/></linearGradient><linearGradient id="icon-gradient" gradientUnits="userSpaceOnUse" x1="-35" y1="-35" x2="35" y2="35"><stop offset="0%" stop-color="#634dcc"/><stop offset="25%" stop-color="#7563cc"/><stop offset="50%" stop-color="#8b7ccf"/><stop offset="75%" stop-color="#9e93cf"/><stop offset="100%" stop-color="#b1a8d7"/></linearGradient><linearGradient id="label-gradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#634dcc"/><stop offset="25%" stop-color="#7563cc"/><stop offset="50%" stop-color="#8b7ccf"/><stop offset="75%" stop-color="#9e93cf"/><stop offset="100%" stop-color="#b1a8d7"/></linearGradient></defs><rect x="0" y="0" width="1400" height="600" fill="#f0efeb" /><rect x="0" y="0" width="1400" height="9" fill="#634dcc" /><text x="55" y="73" font-family="Menlo,Consolas,monospace" font-size="16" fill="#634dcc" letter-spacing="1.5">QUANTOS / MODULAR TRADING FRAMEWORK</text><g class="robotic-wordmark" aria-label="QuantOS" transform="translate(54 140.64999999999998) scale(1.8902439024390243)"><g fill="none" stroke="#242d43" stroke-width="7" stroke-linecap="square" stroke-linejoin="bevel"><path transform="translate(0 0)" d="M8 0 H34 L42 8 V50 L34 58 H8 L0 50 V8 Z M26 41 L48 64"/><path transform="translate(58 0)" d="M0 18 V50 L8 58 H32 L40 50 V18"/><path transform="translate(112 0)" d="M40 58 V26 L32 18 H8 L0 26 V50 L8 58 H32 L40 50"/><path transform="translate(166 0)" d="M0 58 V18 H30 L40 28 V58"/><path transform="translate(220 0)" d="M14 4 V50 L22 58 H34 M0 20 H34"/><path transform="translate(264 0)" d="M8 0 H34 L42 8 V50 L34 58 H8 L0 50 V8 Z"/><path transform="translate(322 0)" d="M42 8 L34 0 H8 L0 8 V21 L8 29 H34 L42 37 V50 L34 58 H8 L0 50"/></g><rect x="383" y="52" width="24" height="7" fill="#242d43" /></g><text x="61" y="335" font-family="Menlo,Consolas,monospace" font-size="28" fill="#242d43" >Open-source quantitative trading</text><text x="61" y="392" font-family="Menlo,Consolas,monospace" font-size="23" fill="#634dcc" >From research to execution.</text><text x="61" y="455" font-family="Menlo,Consolas,monospace" font-size="17" fill="#697184" >Backtest / Monitor / Visualize / Store / Deploy</text><g data-layer="RESULTS &amp; STORAGE" transform="translate(1130 486) scale(1.32)"><path d="M-116 0 L0 48 L116 0 V12 L0 60 L-116 12 Z" fill="url(#module-gradient)" fill-opacity=".26" stroke="url(#module-gradient)" stroke-width="1.5"/><path d="M0 -48 L116 0 L0 48 L-116 0 Z" fill="#f8f7f3" stroke="url(#module-gradient)" stroke-width="3"/><g transform="matrix(1 .414 -1 .414 0 0)"><path d="M-28 -19 Q0 -34 28 -19 Q0 -4 -28 -19 V20 Q0 35 28 20 V-19 M-28 0 Q0 15 28 0" fill="none" stroke="url(#icon-gradient)" stroke-width="3" stroke-linejoin="round" /></g></g><g data-layer="BACKTESTING" transform="translate(1130 387) scale(1.32)"><path d="M-116 0 L0 48 L116 0 V12 L0 60 L-116 12 Z" fill="url(#module-gradient)" fill-opacity=".26" stroke="url(#module-gradient)" stroke-width="1.5"/><path d="M0 -48 L116 0 L0 48 L-116 0 Z" fill="#f8f7f3" stroke="url(#module-gradient)" stroke-width="3"/><g transform="matrix(1