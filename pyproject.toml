[tool.poetry]
name = "investing-algorithm-framework"
version = "9.0.0a6"
description = "A framework for creating trading bots"
authors = ["MDUYN"]
readme = "README.md"
exclude = ["tests", "static", "examples", "docs"]


[tool.poetry.dependencies]
python = ">=3.10,<4.0"
wrapt = ">=1.16.0"
Flask = ">=3.1.0"
Flask-Cors = ">=3.0.9,<7.0.0"
SQLAlchemy = ">=2.0.18"
marshmallow = ">=3.5.0"
ccxt = ">=4.2.48"
python-dateutil = ">=2.8.2"
dependency-injector= ">=4.40.0"
schedule = ">=1.1.0"
tqdm = ">=4.66.1"
tabulate = ">=0.9.0"
polars = { version = ">=0.20.10", extras = ["numpy", "pandas"] }
python-dotenv = "^1.0.1"
yfinance = {version = "^0.2.61", optional = true}
alpha_vantage = {version = "^3.0.0", optional = true}
polygon-api-client = {version = "^1.14.0", optional = true}
finterion-charts = "1.4.0"
boto3 = {version = "^1.38.41", optional = true}
azure-storage-blob = {version = "^12.24.0", optional = true}
azure-identity = {version = "^1.19.0", optional = true}
azure-mgmt-storage = {version = "^21.2.1", optional = true}
azure-mgmt-web = {version = "^7.3.1", optional = true}
azure-mgmt-resource = {version = "^23.2.0", optional = true}
ipython = {version = ">=8.0.0", optional = true}
msgpack = ">=1.0.0"
zstandard = ">=0.20.0"
pyarrow = ">=14.0.0"

[tool.poetry.extras]
yahoo = ["yfinance"]
alpha_vantage = ["alpha_vantage"]
polygon = ["polygon-api-client"]
aws = ["boto3"]
azure = ["azure-storage-blob", "azure-identity", "azure-mgmt-storage", "azure-mgmt-web", "azure-mgmt-resource"]
notebook = ["ipython"]
all = ["yfinance", "alpha_vantage", "polygon-api-client", "boto3", "azure-storage-blob", "azure-identity", "azure-mgmt-storage", "azure-mgmt-web", "azure-mgmt-resource", "ipython"]

[tool.poetry.group.test.dependencies]
coverage= "7.4.2"
flake8 = "7.0.0"
Flask-Testing = "^0.8.1"
pyindicators = "0.11.1"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
investing-algorithm-framework = "investing_algorithm_framework.cli.cli:cli"

[tool.coverage.run]
omit = ["*/dependency_injector/*"]
